[package]
name = "bitcoin-silicon"
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.98"
base64 = "=0.22.1"
bitcoin = "=0.32.7"
getrandom = "=0.2.16"
hex = "=0.4.3"
libc = "=0.2.191"
num-bigint = "=0.4.6"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
sha2 = { version = "=0.10.9", features = ["asm", "compress"] }
tempfile = "=3.20.0"
tiny_http = "=0.12.0"
minreq = "=2.14.1"
zeroize = "=1.8.1"

[profile.release]
lto = "thin"
codegen-units = 1
